# MyCMS workspace (pnpm 10) — AGENTS.md §6 mirrors the commands that act on this file.
packages:
  - packages/*
  - playground

# Exact catalog pins (renovate keeps them current; ADR-0010 §2 pins + supply-chain law).
catalog:
  typescript: 7.0.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 22.20.5
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@biomejs/biome": 2.6.3
  tsup: 9.0.0
  zod: 4.6.7
  fast-check: 4.10.2
  idb-keyval: 6.3.0
  msw: 3.0.3
  yaml: 2.9.1
  "@changesets/cli": 3.0.3

# Fail installs on engine drift (Node 22 pin law, ADR-0010 §5).
engine-strict: true

# Committed postinstall-allowlist (P0.3 — accept-by-run list with per-entry reason).
# NEVER add: playwright (browsers land via an explicit `playwright install chromium`),
# shiki, SWC, or anything without a runbook reason (AGENTS.md §4 "Ask first").
onlyBuiltDependencies:
  # esbuild — its postinstall materializes the platform JS binary (used by tsup/vite builds)
  - esbuild
