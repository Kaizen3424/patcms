name: release

# ADR-0010 release law: npm trusted publishing over OIDC — no NPM_TOKEN exists
# anywhere. This exact filename is registered as the trusted publisher on
# npmjs.com (repository Kaizen3424/pagesmith), so renaming this file must move
# both sides together. The release job is the only job allowed to elevate to
# `contents: write` + `id-token: write`; scripts/ci-workflow-guard.mjs enforces
# that shape.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # version-PR branch and the v<version> release tag
      pull-requests: write # the Version Packages PR
      id-token: write # npm trusted publishing (OIDC) — pnpm exchanges the token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — changesets reads tags and branches)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm (pinned via packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the publishable package (publishConfig points at dist)
        run: pnpm --filter patcms build
      - name: Changesets — version PR, or publish when none are pending
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: changeset version
          # pnpm, not `changeset publish`: pnpm rewrites the `catalog:` protocol
          # into real versions at pack time (npm would ship it literally), and
          # pnpm -r publish publishes only versions missing from the registry.
          # --report-summary feeds the release step below.
          publish-script: pnpm -r publish --no-git-checks --report-summary
          push-git-tags: false # the step below tags v<version> instead
          create-github-releases: false # the step below releases with changeset notes
      - name: Tag the release and create the GitHub Release (changeset notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-github-release.mjs
